services:
  minio:
    image: minio/minio:latest
    container_name: crypto_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - crypto_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: crypto_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: crypto_user
      POSTGRES_PASSWORD: crypto_password_123
      POSTGRES_DB: crypto_dw
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - crypto_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto_user -d crypto_dw"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow:
    image: apache/airflow:2.7.3-python3.10
    container_name: crypto_airflow
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://crypto_user:crypto_password_123@postgres:5432/crypto_dw
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=crypto_user
      - POSTGRES_PASSWORD=crypto_password_123
      - POSTGRES_DB=crypto_dw
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../src:/opt/airflow/project/src
      - ../requirements.txt:/opt/airflow/project/requirements.txt:ro
    ports:
      - "8080:8080"
    command: >
      bash -c "
        pip install --no-cache-dir minio python-dotenv &&
        airflow db migrate &&
        (airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || echo 'User already exists') &&
        airflow standalone
      "
    networks:
      - crypto_network


  grafana:
    image: grafana/grafana:10.2.2
    container_name: crypto_grafana
    restart: always
    depends_on:
      - postgres
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - crypto_network


  etl:
    build:
      context: .. # Kök dizin (Dockerfile'ın src'yi görebilmesi için)
      dockerfile: docker/Dockerfile.etl
    container_name: crypto_etl
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - ../.env # Kök dizindeki .env dosyasını oku
    environment:
      # Docker içindeki host isimleri (localhost değil!)
      - MINIO_ENDPOINT=minio:9000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    networks:
      - crypto_network

volumes:
  minio_data:
  postgres_data:
  grafana_data:

networks:
  crypto_network:
    driver: bridge